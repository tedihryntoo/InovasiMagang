<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Registrasi - Inovasi Magang</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    h2 { font-size: 1.75rem; margin-bottom: 8px; text-align: center; color: #f8fafc; }
    .subtitle { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
    
    .input-group {
      margin-bottom: 18px;
    }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; font-weight: 500; }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: white;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); color: white; }

    #status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .back-link:hover { color: #38bdf8; }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>Selamat Datang</h2>
    <p class="subtitle">Masuk atau daftar akun Firebase</p>

    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="nama@email.com">
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <div class="btn-group">
      <button id="login" class="btn btn-primary">Masuk</button>
      <button id="register" class="btn btn-secondary">Daftar</button>
    </div>

    <div id="status"></div>

    <a href="index.html" class="back-link">← Kembali ke Beranda</a>
  </div>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const status = document.getElementById("status");

    function showStatus(msg, isError = false) {
      status.style.display = "block";
      status.textContent = msg;
      status.style.background = isError ? "rgba(239, 68, 68, 0.15)" : "rgba(16, 185, 129, 0.15)";
      status.style.color = isError ? "#f87171" : "#34d399";
      status.style.border = isError ? "1px solid rgba(248, 113, 113, 0.3)" : "1px solid rgba(52, 211, 153, 0.3)";
    }

    document.getElementById("register").onclick = async () => {
      if (!email.value || !password.value) {
        showStatus("Email dan password harus diisi!", true);
        return;
      }
      try {
        showStatus("Mendaftarkan akun...");
        await createUserWithEmailAndPassword(auth, email.value, password.value);
        showStatus("Registrasi berhasil! Silakan login.");
      } catch (error) {
        showStatus(error.message, true);
      }
    };

    document.getElementById("login").onclick = async () => {
      if (!email.value || !password.value) {
        showStatus("Email dan password harus diisi!", true);
        return;
      }
      try {
        showStatus("Sedang masuk...");
        await signInWithEmailAndPassword(auth, email.value, password.value);
        window.location.replace("./dashboard.html");
      } catch (error) {
        showStatus(error.message, true);
      }
    };
  </script>

</body>
</html>
