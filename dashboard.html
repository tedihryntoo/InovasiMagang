<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Inovasi Magang</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-weight: 600; font-size: 1.1rem; color: #38bdf8; }
    
    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h2 { font-size: 1.8rem; margin-bottom: 8px; }
    .welcome-sub { color: #94a3b8; margin-bottom: 30px; font-size: 0.95rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }
    .card h3 { font-size: 1.1rem; margin-bottom: 12px; color: #cbd5e1; }
    .card p { color: #94a3b8; font-size: 0.9rem; line-height: 1.4; }
    .email-val { font-size: 1.15rem; font-weight: 600; color: #38bdf8; margin-top: 6px; word-break: break-all; }
    
    .status-box {
      margin-top: 10px;
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .iot-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: #34d399;
      border-radius: 50%;
      box-shadow: 0 0 8px #34d399;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Inovasi Magang Dashboard</div>
    <button id="logout" class="btn-logout">Keluar</button>
  </header>

  <main>
    <h2>Dashboard IoT</h2>
    <p class="welcome-sub">Selamat datang kembali di panel monitoring sistem.</p>

    <div class="grid">
      <div class="card">
        <h3>Informasi Akun</h3>
        <p>Email Terdaftar:</p>
        <div id="userEmail" class="email-val">Memuat akun...</div>
        <div id="status" class="status-box" style="margin-top: 15px;">Memeriksa sesi...</div>
      </div>

      <div class="card">
        <h3>Status Perangkat ESP32</h3>
        <p>Koneksi realtime ke Firebase Realtime Database:</p>
        <div class="iot-status">
          <div class="dot"></div>
          <span style="font-size: 0.9rem; color: #e2e8f0;">Sistem Siap / Menunggu Data</span>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth } from "./js/firebase.js";
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const userEmail = document.getElementById("userEmail");
    const status = document.getElementById("status");
    const logout = document.getElementById("logout");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        userEmail.textContent = user.email;
        status.textContent = "✓ Sesi Aktif & Terautentikasi";
      } else {
        window.location.replace("./login.html");
      }
    });

    logout.onclick = async () => {
      try {
        await signOut(auth);
        window.location.replace("./login.html");
      } catch (error) {
        status.textContent = error.message;
        status.style.background = "rgba(239, 68, 68, 0.15)";
        status.style.color = "#f87171";
        status.style.border = "1px solid rgba(248, 113, 113, 0.3)";
      }
    };
  </script>

</body>
</html>
